<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
   <main>
        <div class="button-tabs">
            <button class="tab-button" data-plan="basic">Basic</button>
            <button class="tab-button active" data-plan="standard">Standard</button>
            <button class="tab-button" data-plan="premium">Premium</button>
        </div>

        <div class="card-content">
            <span class="subtitle" id="plan-subtitle">STANDARD</span>
            <div class="title-price-row">
                <h1 class="title">Icon Sets</h1>
                <span class="price" id="plan-price">$120</span>
            </div>
            <p class="description" id="plan-desc">Up to 100 creative & professional icons + two color versions/themes per month</p>

            <ul class="card-list">
                <li>
                    <img src="design/list.svg" class="check-icon">
                    <p>Included source files</p>
                </li>
                <li>
                    <img src="design/list.svg" class="check-icon" id="responsive-icon">
                    <p id="responsive-text">Converted to responsive components</p>
                </li>
            </ul>

            <button class="submit-button">Add to cart</button>
        </div>
   </main>

   <script src="script.js"></script>
</body>

</html>
